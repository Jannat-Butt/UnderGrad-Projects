<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body style="background-image: url('{{ url_for('static', filename='house_image.jpg') }}');">
    <div class="result-container">
        {% if prediction is defined %}
            <h1>Predicted House Price:</h1>
            <h2>${{ '{:,.2f}'.format(prediction) }}</h2> 
        {% else %}
            <h1>Error:</h1>
            <p>{{ error_message }}</p>
        {% endif %}
        <hr>
        <a href="/frontend">Go back to home page</a>
    </div>
</body>
</html>
