<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch-to-Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        form {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            text-align: center;
            width: 300px;
            margin-bottom: 2rem;
        }

        input[type="file"] {
            margin-bottom: 1rem;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        h2 {
            color: #444;
            font-size: 1.5rem;
            margin-top: 2rem;
        }

        .image-container {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            width: 100%;
            max-width: 600px;
        }

        img {
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 48%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>Upload a Sketch to Generate an Image</h1>
    <form action="/" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Generate</button>
    </form>

    {% if sketch_path %}
        <h2>Input Sketch:</h2>
        <div class="image-container">
            <img src="{{ sketch_path }}" alt="Input Sketch">
            <img src="{{ gen_path }}" alt="Generated Image">
        </div>
    {% endif %}
</body>
</html>
